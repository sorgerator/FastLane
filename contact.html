<!doctype html>
<html lang="bs" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tarik Tires - Kontakt</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container">
        <a class="navbar-brand" href="index.html">Tarik Tires</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Početna</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="services.html">Usluge</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="appointments.html">Termini</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="contact.html">Kontakt</a>
            </li>
            <li class="nav-item">
              <button
                id="theme-toggle"
                class="btn btn-outline-secondary btn-sm ms-2"
              >
                Theme
              </button>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container my-5">
      <form data-netlify="true" class="needs-validation" novalidate>
        <div class="mb-3">
          <label for="name" class="form-label">Ime i Prezime</label>
          <input
            type="text"
            class="form-control"
            id="name"
            name="name"
            required
          />
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input
            type="email"
            class="form-control"
            id="email"
            name="email"
            required
          />
        </div>
        <button type="submit" class="btn btn-primary">Pošalji</button>
      </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/theme.js"></script>
  </body>
</html>
